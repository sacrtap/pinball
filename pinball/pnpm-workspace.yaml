# pnpm ≥ 10 的构建脚本白名单（pnpm 10 用 onlyBuiltDependencies 列表声明）。
# 这些包的安装后脚本必须执行：prisma client 生成、argon2/esbuild/msgpackr-extract
# 原生编译、unrs-resolver 供 eslint 使用。缺任一项都会导致启动失败。
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - unrs-resolver
# allowBuilds 是 pnpm 12+ 的新语法（map 形式），pnpm 10 用 onlyBuiltDependencies。
# 保留此处兼容未来升级；当前 pnpm 10 忽略 allowBuilds。
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

# 显式声明不使用发布年龄门禁，避免 pnpm 自动向此列表追加条目。
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - lucide-react@1.62.0
  - resend@6.35.0

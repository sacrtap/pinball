# 「幻想兔」弹珠机预测系统 — 全栈编排
# 本地开发环境（无 Docker 时）直接使用本机 PostgreSQL 18 + Redis，
# 本文件为自托管交付物：docker compose up -d 一键起 app + postgres + pgbouncer + redis + worker。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinball}
      POSTGRES_USER: ${POSTGRES_USER:-pinball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinball}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 应用连接角色（非 superuser、非 BYPASSRLS）：首次初始化时执行
      - ./prisma/sql/01-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinball} -d ${POSTGRES_DB:-pinball}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:1.23
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-pinball}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pinball}
      DB_NAME: ${POSTGRES_DB:-pinball}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    # transaction 模式兼容 RLS 的 set_config(..., true) 事务本地设置

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@pgbouncer:6432/${POSTGRES_DB:-pinball}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@postgres:5432/${POSTGRES_DB:-pinball}
      REDIS_URL: redis://redis:6379
      # L4 全局先验聚合角色（BYPASSRLS，仅跨租户聚合 job 使用）
      AGG_DATABASE_URL: postgresql://pinball_agg:pinball_agg_dev@postgres:5432/${POSTGRES_DB:-pinball}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pinball.local}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["pnpm", "worker"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@pgbouncer:6432/${POSTGRES_DB:-pinball}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@postgres:5432/${POSTGRES_DB:-pinball}
      REDIS_URL: redis://redis:6379
      AGG_DATABASE_URL: postgresql://pinball_agg:pinball_agg_dev@postgres:5432/${POSTGRES_DB:-pinball}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}

volumes:
  pgdata:

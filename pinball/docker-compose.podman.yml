# 「幻想兔」弹珠机预测系统 — Podman 部署编排
# 与 docker-compose.yml 的区别：
#   1. app 容器加入外部网络 services-net，使 cloudflared 可通过容器名访问
#   2. app 容器不暴露端口到宿主机（与 9router 一致，由 cloudflared 内部路由）
#   3. AUTH_URL 指向 https://pinball.jqmro.com
#   4. app 容器固定名称 pinball-app，cloudflared Dashboard 中以此为 hostname
#
# 使用方式：
#   cd pinball/pinball
#   cp .env.podman.example .env.podman
#   # 编辑 .env.podman，填入 AUTH_SECRET 等
#   podman compose -f docker-compose.podman.yml --env-file .env.podman up -d --build
#   podman compose -f docker-compose.podman.yml exec app pnpm prisma migrate deploy
#   podman compose -f docker-compose.podman.yml exec app pnpm prisma db seed

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pinball}
      POSTGRES_USER: ${POSTGRES_USER:-pinball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinball}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 应用连接角色（非 superuser、非 BYPASSRLS）：首次初始化时执行
      - ./prisma/sql/01-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinball} -d ${POSTGRES_DB:-pinball}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-pinball}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pinball}
      DB_NAME: ${POSTGRES_DB:-pinball}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    depends_on:
      postgres:
        condition: service_healthy
    # transaction 模式兼容 RLS 的 set_config(..., true) 事务本地设置

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: pinball-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@pgbouncer:6432/${POSTGRES_DB:-pinball}?pgbouncer=true&connection_limit=1
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@postgres:5432/${POSTGRES_DB:-pinball}
      REDIS_URL: redis://redis:6379
      # L4 全局先验聚合角色（BYPASSRLS，仅跨租户聚合 job 使用）
      AGG_DATABASE_URL: postgresql://pinball_agg:pinball_agg_dev@postgres:5432/${POSTGRES_DB:-pinball}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      AUTH_URL: ${AUTH_URL:-https://pinball.jqmro.com}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@pinball.jqmro.com}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ENABLE_TEST_ROUTES: ${ENABLE_TEST_ROUTES:-false}
    networks:
      - default
      - services-net
    # 不发布端口 — cloudflared 通过 services-net 内部网络访问
    # 如需本地调试可取消注释下面一行
    # ports:
    #   - "8477:3000"

  worker:
    container_name: pinball-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["pnpm", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@pgbouncer:6432/${POSTGRES_DB:-pinball}?pgbouncer=true&connection_limit=1
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-pinball}:${POSTGRES_PASSWORD:-pinball}@postgres:5432/${POSTGRES_DB:-pinball}
      REDIS_URL: redis://redis:6379
      AGG_DATABASE_URL: postgresql://pinball_agg:pinball_agg_dev@postgres:5432/${POSTGRES_DB:-pinball}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
    networks:
      - default

networks:
  default:
    name: pinball-net
  # 外部网络：cloudflared 容器也在这个网络中
  # cloudflared 通过此网络访问 pinball-app:3000
  services-net:
    external: true

volumes:
  pgdata:
    name: pinball-pgdata
